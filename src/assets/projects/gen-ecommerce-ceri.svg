<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
  <defs>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#3d3a33" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="cov1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a65"/><stop offset="100%" stop-color="#d84315"/>
    </linearGradient>
    <linearGradient id="cov2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4db6ac"/><stop offset="100%" stop-color="#00695c"/>
    </linearGradient>
    <linearGradient id="cov3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd54f"/><stop offset="100%" stop-color="#f57f17"/>
    </linearGradient>
    <linearGradient id="cov4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9575cd"/><stop offset="100%" stop-color="#4527a0"/>
    </linearGradient>
  </defs>

  <!-- Fond papier chaud -->
  <rect width="1200" height="750" fill="#f4f1ea"/>
  <circle cx="1130" cy="60" r="190" fill="#e8e2d4" opacity="0.6"/>
  <circle cx="40" cy="720" r="150" fill="#e8e2d4" opacity="0.5"/>

  <!-- Barre de navigation -->
  <rect x="0" y="0" width="1200" height="86" fill="#ffffff" filter="url(#card)"/>
  <circle cx="70" cy="43" r="20" fill="#00695c"/>
  <circle cx="70" cy="43" r="8" fill="#ffffff"/>
  <circle cx="70" cy="43" r="3" fill="#00695c"/>
  <rect x="110" y="34" width="92" height="18" rx="9" fill="#d8d2c4"/>

  <!-- Barre de recherche -->
  <rect x="380" y="24" width="440" height="38" rx="19" fill="#f0ece2" stroke="#dcd5c4"/>
  <circle cx="410" cy="43" r="8" fill="none" stroke="#8a8271" stroke-width="2.5"/>
  <line x1="416" y1="49" x2="423" y2="56" stroke="#8a8271" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="436" y="38" width="150" height="10" rx="5" fill="#dcd5c4"/>

  <!-- Panier -->
  <g transform="translate(1108,43)">
    <path d="M-14 -8 h4 l4 16 h16 l4 -12 h-22" fill="none" stroke="#3d3a33" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-3" cy="14" r="2.6" fill="#3d3a33"/>
    <circle cx="10" cy="14" r="2.6" fill="#3d3a33"/>
    <circle cx="12" cy="-10" r="10" fill="#d84315"/>
    <text x="12" y="-5.5" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">3</text>
  </g>

  <!-- Filtres (pastilles skeleton) -->
  <rect x="70" y="122" width="86" height="30" rx="15" fill="#00695c"/>
  <rect x="90" y="132" width="46" height="10" rx="5" fill="#bfe3dd"/>
  <rect x="168" y="122" width="86" height="30" rx="15" fill="#ffffff" stroke="#dcd5c4"/>
  <rect x="188" y="132" width="46" height="10" rx="5" fill="#d8d2c4"/>
  <rect x="266" y="122" width="86" height="30" rx="15" fill="#ffffff" stroke="#dcd5c4"/>
  <rect x="286" y="132" width="46" height="10" rx="5" fill="#d8d2c4"/>
  <rect x="364" y="122" width="86" height="30" rx="15" fill="#ffffff" stroke="#dcd5c4"/>
  <rect x="384" y="132" width="46" height="10" rx="5" fill="#d8d2c4"/>

  <!-- ═══ Grille de 4 vinyles ═══ -->
  <!-- Carte 1 -->
  <g>
    <rect x="70" y="190" width="250" height="440" rx="20" fill="#ffffff" filter="url(#card)"/>
    <rect x="94" y="214" width="202" height="202" rx="12" fill="url(#cov1)"/>
    <circle cx="238" cy="315" r="86" fill="#181310"/>
    <circle cx="238" cy="315" r="82" fill="none" stroke="#2e2620" stroke-width="1.5"/>
    <circle cx="238" cy="315" r="66" fill="none" stroke="#2e2620" stroke-width="1.5"/>
    <circle cx="238" cy="315" r="50" fill="none" stroke="#2e2620" stroke-width="1.5"/>
    <circle cx="238" cy="315" r="28" fill="#e8ddc8"/>
    <circle cx="238" cy="315" r="4" fill="#181310"/>
    <rect x="94" y="440" width="140" height="16" rx="8" fill="#d8d2c4"/>
    <rect x="94" y="466" width="90" height="12" rx="6" fill="#e6e1d3"/>
    <text x="94" y="530" fill="#3d3a33" font-size="24" font-weight="800">24,90 €</text>
    <rect x="94" y="560" width="202" height="44" rx="22" fill="#00695c"/>
    <path d="M186 582 h18 M195 573 v18" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Carte 2 (promo) -->
  <g>
    <rect x="360" y="190" width="250" height="440" rx="20" fill="#ffffff" filter="url(#card)"/>
    <rect x="384" y="214" width="202" height="202" rx="12" fill="url(#cov2)"/>
    <circle cx="528" cy="315" r="86" fill="#181310"/>
    <circle cx="528" cy="315" r="78" fill="none" stroke="#2e2620" stroke-width="1.5"/>
    <circle cx="528" cy="315" r="60" fill="none" stroke="#2e2620" stroke-width="1.5"/>
    <circle cx="528" cy="315" r="28" fill="#f3d9a4"/>
    <circle cx="528" cy="315" r="4" fill="#181310"/>
    <rect x="370" y="204" width="74" height="30" rx="15" fill="#d84315"/>
    <text x="407" y="224" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">−20%</text>
    <rect x="384" y="440" width="150" height="16" rx="8" fill="#d8d2c4"/>
    <rect x="384" y="466" width="80" height="12" rx="6" fill="#e6e1d3"/>
    <text x="384" y="530" fill="#3d3a33" font-size="24" font-weight="800">18,50 €</text>
    <text x="490" y="528" fill="#a39b87" font-size="16" text-decoration="line-through">22,90 €</text>
    <rect x="384" y="560" width="202" height="44" rx="22" fill="#00695c"/>
    <path d="M476 582 h18 M485 573 v18" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Carte 3 -->
  <g>
    <rect x="650" y="190" width="250" height="440" rx="20" fill="#ffffff" filter="url(#card)"/>
    <rect x="674" y="214" width="202" height="202" rx="12" fill="url(#cov3)"/>
    <circle cx="818" cy="315" r="86" fill="#181310"/>
    <circle cx="818" cy="315" r="80" fill="none" stroke="#2e2620" stroke-width="1.5"/>
    <circle cx="818" cy="315" r="62" fill="none" stroke="#2e2620" stroke-width="1.5"/>
    <circle cx="818" cy="315" r="44" fill="none" stroke="#2e2620" stroke-width="1.5"/>
    <circle cx="818" cy="315" r="28" fill="#c8553d"/>
    <circle cx="818" cy="315" r="4" fill="#181310"/>
    <rect x="674" y="440" width="120" height="16" rx="8" fill="#d8d2c4"/>
    <rect x="674" y="466" width="100" height="12" rx="6" fill="#e6e1d3"/>
    <text x="674" y="530" fill="#3d3a33" font-size="24" font-weight="800">27,00 €</text>
    <rect x="674" y="560" width="202" height="44" rx="22" fill="#00695c"/>
    <path d="M766 582 h18 M775 573 v18" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Carte 4 -->
  <g>
    <rect x="940" y="190" width="250" height="440" rx="20" fill="#ffffff" filter="url(#card)"/>
    <rect x="964" y="214" width="202" height="202" rx="12" fill="url(#cov4)"/>
    <circle cx="1108" cy="315" r="86" fill="#181310"/>
    <circle cx="1108" cy="315" r="76" fill="none" stroke="#2e2620" stroke-width="1.5"/>
    <circle cx="1108" cy="315" r="56" fill="none" stroke="#2e2620" stroke-width="1.5"/>
    <circle cx="1108" cy="315" r="28" fill="#b3a1e0"/>
    <circle cx="1108" cy="315" r="4" fill="#181310"/>
    <rect x="964" y="440" width="160" height="16" rx="8" fill="#d8d2c4"/>
    <rect x="964" y="466" width="70" height="12" rx="6" fill="#e6e1d3"/>
    <text x="964" y="530" fill="#3d3a33" font-size="24" font-weight="800">21,90 €</text>
    <rect x="964" y="560" width="202" height="44" rx="22" fill="#00695c"/>
    <path d="M1056 582 h18 M1065 573 v18" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Pagination -->
  <circle cx="560" cy="690" r="6" fill="#00695c"/>
  <circle cx="586" cy="690" r="6" fill="#d8d2c4"/>
  <circle cx="612" cy="690" r="6" fill="#d8d2c4"/>
  <circle cx="638" cy="690" r="6" fill="#d8d2c4"/>
</svg>
