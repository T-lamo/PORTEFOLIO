<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <filter id="eshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2a3a26" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Fond crème éco -->
  <rect width="1200" height="750" fill="#f2efe3"/>
  <circle cx="90" cy="90" r="180" fill="#e5e0cc" opacity="0.7"/>
  <circle cx="1140" cy="690" r="220" fill="#e5e0cc" opacity="0.7"/>

  <!-- Feuilles décoratives -->
  <g fill="#9db878" opacity="0.55">
    <path d="M140 620 q0 -46 46 -46 q0 46 -46 46 z"/>
    <path d="M108 660 q0 -34 34 -34 q0 34 -34 34 z" opacity="0.7"/>
  </g>
  <g fill="#9db878" opacity="0.45">
    <path d="M1060 120 q0 -40 40 -40 q0 40 -40 40 z"/>
  </g>

  <!-- ═══ Boucle circulaire du recyclage ═══ -->
  <g transform="translate(600,380)">
    <!-- Arcs épais formant l'anneau -->
    <g fill="none" stroke-linecap="round" stroke-width="34">
      <path d="M-2 -218 A218 218 0 0 1 187 -110" stroke="#16a34a"/>
      <path d="M215 38 A218 218 0 0 1 96 196" stroke="#65a30d"/>
      <path d="M-96 196 A218 218 0 0 1 -215 38" stroke="#0d9488"/>
      <path d="M-187 -110 A218 218 0 0 1 -60 -209" stroke="#166534"/>
    </g>
    <!-- Pointes de flèches -->
    <path d="M187 -110 l36 -26 l-8 46 z" fill="#16a34a"/>
    <path d="M96 196 l-16 42 l-28 -36 z" fill="#65a30d"/>
    <path d="M-215 38 l-38 -20 l32 -30 z" fill="#0d9488"/>
    <path d="M-60 -209 l14 -40 l28 34 z" fill="#166534"/>

    <!-- Badges stations -->
    <!-- Sac poubelle (haut) -->
    <g transform="translate(118,-192)">
      <circle r="52" fill="#ffffff" filter="url(#eshadow)"/>
      <path d="M-17 -14 h34 l6 34 a10 10 0 0 1 -10 10 h-26 a10 10 0 0 1 -10 -10 z" fill="#16a34a"/>
      <path d="M-10 -14 q0 -12 10 -12 q10 0 10 12" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- Camion (droite bas) -->
    <g transform="translate(168,138)">
      <circle r="52" fill="#ffffff" filter="url(#eshadow)"/>
      <rect x="-26" y="-14" width="32" height="24" rx="4" fill="#65a30d"/>
      <path d="M6 -6 h14 l8 10 v6 h-22 z" fill="#65a30d"/>
      <circle cx="-13" cy="14" r="6.5" fill="#3f4a1f"/>
      <circle cx="16" cy="14" r="6.5" fill="#3f4a1f"/>
    </g>
    <!-- Engrenage usine (gauche bas) -->
    <g transform="translate(-168,138)">
      <circle r="52" fill="#ffffff" filter="url(#eshadow)"/>
      <circle r="17" fill="none" stroke="#0d9488" stroke-width="7"/>
      <g stroke="#0d9488" stroke-width="7" stroke-linecap="round">
        <line x1="0" y1="-24" x2="0" y2="-31"/>
        <line x1="0" y1="24" x2="0" y2="31"/>
        <line x1="-24" y1="0" x2="-31" y2="0"/>
        <line x1="24" y1="0" x2="31" y2="0"/>
        <line x1="-17" y1="-17" x2="-22" y2="-22"/>
        <line x1="17" y1="17" x2="22" y2="22"/>
        <line x1="-17" y1="17" x2="-22" y2="22"/>
        <line x1="17" y1="-17" x2="22" y2="-22"/>
      </g>
    </g>
    <!-- Granulés (gauche haut) -->
    <g transform="translate(-118,-192)">
      <circle r="52" fill="#ffffff" filter="url(#eshadow)"/>
      <circle cx="-12" cy="10" r="9" fill="#166534"/>
      <circle cx="10" cy="14" r="9" fill="#16a34a"/>
      <circle cx="0" cy="-8" r="9" fill="#65a30d"/>
      <circle cx="16" cy="-12" r="7" fill="#166534" opacity="0.7"/>
      <circle cx="-16" cy="-12" r="7" fill="#0d9488" opacity="0.8"/>
    </g>

    <!-- Cœur : pièce (valeur créée) -->
    <circle r="86" fill="#ffffff" filter="url(#eshadow)"/>
    <circle r="56" fill="#f6d55c"/>
    <circle r="56" fill="none" stroke="#d9a520" stroke-width="4"/>
    <circle r="42" fill="none" stroke="#d9a520" stroke-width="2.5" stroke-dasharray="5 6"/>
    <g fill="none" stroke="#b58312" stroke-width="6.5" stroke-linecap="round">
      <path d="M18 -22 a30 30 0 1 0 0 44"/>
      <line x1="-22" y1="-7" x2="10" y2="-7"/>
      <line x1="-22" y1="7" x2="10" y2="7"/>
    </g>
  </g>

  <!-- Mini carte analytics (coin haut droit) -->
  <g transform="translate(985,80)">
    <rect width="165" height="120" rx="16" fill="#ffffff" filter="url(#eshadow)"/>
    <rect x="22" y="62" width="18" height="38" rx="5" fill="#9db878"/>
    <rect x="50" y="46" width="18" height="54" rx="5" fill="#65a30d"/>
    <rect x="78" y="70" width="18" height="30" rx="5" fill="#9db878"/>
    <rect x="106" y="30" width="18" height="70" rx="5" fill="#16a34a"/>
    <path d="M24 46 L58 32 L86 52 L118 16" fill="none" stroke="#d9a520" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
    <circle cx="118" cy="16" r="5" fill="#d9a520"/>
  </g>

  <!-- Épingle carte (coin bas gauche) : géoloc des collecteurs -->
  <g transform="translate(105,520)">
    <path d="M0 0 C -26 -34, -26 -62, 0 -62 C 26 -62, 26 -34, 0 0 Z" fill="#0d9488" filter="url(#eshadow)"/>
    <circle cx="0" cy="-40" r="12" fill="#ffffff"/>
  </g>
</svg>
