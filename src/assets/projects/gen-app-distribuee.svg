<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <radialGradient id="vbg" cx="38%" cy="45%" r="90%">
      <stop offset="0%" stop-color="#2a0f45"/>
      <stop offset="55%" stop-color="#170830"/>
      <stop offset="100%" stop-color="#0a0316"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#vbg)"/>

  <!-- Étoiles discrètes -->
  <g fill="#c4b5fd" opacity="0.45">
    <circle cx="140" cy="120" r="2"/><circle cx="320" cy="80" r="1.5"/><circle cx="90" cy="420" r="1.5"/>
    <circle cx="540" cy="110" r="2"/><circle cx="960" cy="90" r="1.5"/><circle cx="1120" cy="220" r="2"/>
    <circle cx="1040" cy="560" r="1.5"/><circle cx="240" cy="640" r="2"/><circle cx="700" cy="70" r="1.5"/>
  </g>

  <!-- Halo derrière le téléphone -->
  <circle cx="360" cy="360" r="150" fill="#a855f7" opacity="0.22" filter="url(#soft)"/>

  <!-- Téléphone -->
  <g>
    <rect x="270" y="170" width="185" height="380" rx="34" fill="#1e1033" stroke="#a855f7" stroke-width="3"/>
    <rect x="284" y="196" width="157" height="328" rx="20" fill="#12081f"/>
    <rect x="330" y="180" width="65" height="7" rx="3.5" fill="#3b2955"/>

    <!-- Micro à l'écran -->
    <g transform="translate(362,320)">
      <circle r="52" fill="#a855f7" opacity="0.14"/>
      <circle r="36" fill="#a855f7" opacity="0.25"/>
      <rect x="-13" y="-30" width="26" height="42" rx="13" fill="#e879f9"/>
      <path d="M-22 6 a22 22 0 0 0 44 0" fill="none" stroke="#e879f9" stroke-width="5" stroke-linecap="round"/>
      <line x1="0" y1="28" x2="0" y2="40" stroke="#e879f9" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Onde vocale sur l'écran -->
    <g stroke="#c084fc" stroke-width="4" stroke-linecap="round">
      <line x1="316" y1="440" x2="316" y2="456"/>
      <line x1="334" y1="430" x2="334" y2="466"/>
      <line x1="352" y1="418" x2="352" y2="478"/>
      <line x1="370" y1="426" x2="370" y2="470"/>
      <line x1="388" y1="436" x2="388" y2="460"/>
      <line x1="406" y1="428" x2="406" y2="468"/>
    </g>
  </g>

  <!-- Arcs de diffusion depuis le téléphone -->
  <g fill="none" stroke="#a855f7" stroke-linecap="round">
    <path d="M492 280 a105 105 0 0 1 0 160" stroke-width="7" opacity="0.85"/>
    <path d="M530 245 a160 160 0 0 1 0 230" stroke-width="6" opacity="0.55"/>
    <path d="M568 210 a215 215 0 0 1 0 300" stroke-width="5" opacity="0.32"/>
  </g>

  <!-- Faisceaux vers les serveurs -->
  <path d="M470 300 C 620 240, 700 220, 810 208" stroke="url(#beam)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M475 360 C 640 360, 720 368, 822 380" stroke="url(#beam)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M470 420 C 620 480, 700 512, 810 540" stroke="url(#beam)" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- Serveurs distants (3 machines) -->
  <g>
    <g transform="translate(850,150)">
      <rect width="180" height="112" rx="14" fill="#1e1033" stroke="#7c3aed" stroke-width="2.5"/>
      <rect x="18" y="16" width="144" height="22" rx="7" fill="#2c1a4d"/>
      <rect x="18" y="45" width="144" height="22" rx="7" fill="#2c1a4d"/>
      <rect x="18" y="74" width="144" height="22" rx="7" fill="#2c1a4d"/>
      <circle cx="34" cy="27" r="4.5" fill="#34d399"/>
      <circle cx="34" cy="56" r="4.5" fill="#e879f9"/>
      <circle cx="34" cy="85" r="4.5" fill="#34d399"/>
      <rect x="130" y="22" width="24" height="10" rx="3" fill="#4c2f80"/>
      <rect x="130" y="51" width="24" height="10" rx="3" fill="#4c2f80"/>
      <rect x="130" y="80" width="24" height="10" rx="3" fill="#4c2f80"/>
    </g>
    <g transform="translate(870,324)">
      <rect width="180" height="112" rx="14" fill="#1e1033" stroke="#a855f7" stroke-width="3"/>
      <rect x="18" y="16" width="144" height="22" rx="7" fill="#2c1a4d"/>
      <rect x="18" y="45" width="144" height="22" rx="7" fill="#2c1a4d"/>
      <rect x="18" y="74" width="144" height="22" rx="7" fill="#2c1a4d"/>
      <circle cx="34" cy="27" r="4.5" fill="#34d399"/>
      <circle cx="34" cy="56" r="4.5" fill="#34d399"/>
      <circle cx="34" cy="85" r="4.5" fill="#e879f9"/>
      <rect x="130" y="22" width="24" height="10" rx="3" fill="#4c2f80"/>
      <rect x="130" y="51" width="24" height="10" rx="3" fill="#4c2f80"/>
      <rect x="130" y="80" width="24" height="10" rx="3" fill="#4c2f80"/>
    </g>
    <g transform="translate(850,498)">
      <rect width="180" height="112" rx="14" fill="#1e1033" stroke="#7c3aed" stroke-width="2.5"/>
      <rect x="18" y="16" width="144" height="22" rx="7" fill="#2c1a4d"/>
      <rect x="18" y="45" width="144" height="22" rx="7" fill="#2c1a4d"/>
      <rect x="18" y="74" width="144" height="22" rx="7" fill="#2c1a4d"/>
      <circle cx="34" cy="27" r="4.5" fill="#e879f9"/>
      <circle cx="34" cy="56" r="4.5" fill="#34d399"/>
      <circle cx="34" cy="85" r="4.5" fill="#34d399"/>
      <rect x="130" y="22" width="24" height="10" rx="3" fill="#4c2f80"/>
      <rect x="130" y="51" width="24" height="10" rx="3" fill="#4c2f80"/>
      <rect x="130" y="80" width="24" height="10" rx="3" fill="#4c2f80"/>
    </g>
  </g>

  <!-- Notes de musique revenant vers le téléphone -->
  <g fill="#e879f9">
    <g transform="translate(700,300) rotate(-12)">
      <ellipse cx="0" cy="10" rx="9" ry="7"/>
      <rect x="6.5" y="-22" width="3.5" height="32" rx="1.75"/>
      <path d="M10 -22 q16 4 18 14 q-8 -7 -18 -6 z"/>
    </g>
    <g transform="translate(620,470) rotate(10)" opacity="0.8">
      <ellipse cx="0" cy="10" rx="8" ry="6"/>
      <rect x="5.5" y="-19" width="3" height="29" rx="1.5"/>
      <path d="M8.5 -19 q14 3.5 16 12 q-7 -6 -16 -5 z"/>
    </g>
    <g transform="translate(590,190) rotate(-6)" opacity="0.65">
      <ellipse cx="-7" cy="12" rx="7.5" ry="5.5"/>
      <ellipse cx="17" cy="8" rx="7.5" ry="5.5"/>
      <rect x="-1" y="-18" width="3" height="30" rx="1.5"/>
      <rect x="23" y="-22" width="3" height="30" rx="1.5"/>
      <path d="M-1 -18 L26 -22 L26 -13 L-1 -9 Z"/>
    </g>
  </g>

  <!-- Grande onde en bas -->
  <path d="M0 690 C 90 640, 160 730, 250 685 C 340 640, 400 735, 490 690 C 580 645, 650 730, 740 688 C 830 646, 900 732, 990 690 C 1070 652, 1130 720, 1200 685"
        fill="none" stroke="url(#wave)" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M0 705 C 90 665, 160 745, 250 702 C 340 660, 400 748, 490 706 C 580 664, 650 744, 740 704 C 830 664, 900 745, 990 705 C 1070 670, 1130 733, 1200 700"
        fill="none" stroke="url(#wave)" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
</svg>
