<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#484a5e"/>
    </pattern>
    <filter id="nshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Canvas éditeur n8n -->
  <rect width="1200" height="750" fill="#33354a"/>
  <rect width="1200" height="750" fill="url(#dots)" opacity="0.5"/>

  <!-- Barre supérieure -->
  <rect width="1200" height="64" fill="#282a3d"/>
  <rect y="63" width="1200" height="1" fill="#1d1e2d"/>
  <circle cx="34" cy="32" r="6" fill="none" stroke="#ff6d5a" stroke-width="3"/>
  <circle cx="52" cy="32" r="6" fill="none" stroke="#ff6d5a" stroke-width="3"/>
  <line x1="40" y1="32" x2="46" y2="32" stroke="#ff6d5a" stroke-width="3"/>
  <text x="74" y="38" fill="#e8e9f3" font-size="16" font-weight="600">Relance J+7</text>
  <rect x="1054" y="16" width="106" height="32" rx="16" fill="#233b2c"/>
  <circle cx="1140" cy="32" r="10" fill="#3dcc77"/>
  <text x="1072" y="37" fill="#3dcc77" font-size="13" font-weight="600">Actif</text>

  <!-- Connexions (béziers) -->
  <g fill="none" stroke="#7b7ea0" stroke-width="2.5">
    <path d="M258 250 C 310 250, 320 250, 372 250"/>
    <path d="M496 232 C 560 200, 600 178, 662 164"/>
    <path d="M496 268 C 560 300, 600 322, 662 336"/>
    <path d="M786 164 C 850 164, 880 164, 942 164"/>
    <path d="M786 336 C 850 336, 880 336, 942 336"/>
    <path d="M258 560 C 330 560, 370 560, 442 560"/>
    <path d="M566 560 C 640 560, 680 560, 752 560"/>
  </g>
  <g fill="#a3a6c9">
    <circle cx="258" cy="250" r="4.5"/><circle cx="372" cy="250" r="4.5"/>
    <circle cx="496" cy="232" r="4.5"/><circle cx="496" cy="268" r="4.5"/>
    <circle cx="662" cy="164" r="4.5"/><circle cx="786" cy="164" r="4.5"/>
    <circle cx="662" cy="336" r="4.5"/><circle cx="786" cy="336" r="4.5"/>
    <circle cx="942" cy="164" r="4.5"/><circle cx="942" cy="336" r="4.5"/>
    <circle cx="258" cy="560" r="4.5"/><circle cx="442" cy="560" r="4.5"/>
    <circle cx="566" cy="560" r="4.5"/><circle cx="752" cy="560" r="4.5"/>
  </g>

  <!-- Nœud : Trello Trigger (forme trigger arrondie à gauche) -->
  <g filter="url(#nshadow)">
    <path d="M215 206 h-45 a44 44 0 0 0 0 88 h45 z" fill="#41435c"/>
    <rect x="172" y="206" width="86" height="88" rx="14" fill="#41435c"/>
  </g>
  <g transform="translate(215,250)">
    <rect x="-22" y="-22" width="44" height="44" rx="8" fill="#0079bf"/>
    <rect x="-13" y="-13" width="11" height="26" rx="3" fill="#ffffff"/>
    <rect x="3" y="-13" width="11" height="16" rx="3" fill="#ffffff"/>
  </g>
  <text x="215" y="322" fill="#c9cbe4" font-size="13" text-anchor="middle">Trello</text>

  <!-- Nœud : IF -->
  <g filter="url(#nshadow)">
    <rect x="372" y="206" width="124" height="88" rx="14" fill="#41435c"/>
  </g>
  <g transform="translate(434,250)" stroke="#b8bad8" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M-20 0 h14"/>
    <path d="M-6 0 C 4 0, 6 -12, 18 -12"/>
    <path d="M-6 0 C 4 0, 6 12, 18 12"/>
  </g>
  <text x="434" y="322" fill="#c9cbe4" font-size="13" text-anchor="middle">IF</text>

  <!-- Nœud : Calendar -->
  <g filter="url(#nshadow)">
    <rect x="662" y="120" width="124" height="88" rx="14" fill="#41435c"/>
  </g>
  <g transform="translate(724,164)">
    <rect x="-20" y="-16" width="40" height="34" rx="6" fill="#4285f4"/>
    <rect x="-20" y="-16" width="40" height="10" rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="-12" y="-22" width="5" height="10" rx="2.5" fill="#e8e9f3"/>
    <rect x="7" y="-22" width="5" height="10" rx="2.5" fill="#e8e9f3"/>
    <rect x="-11" y="0" width="8" height="7" rx="2" fill="#ffffff" opacity="0.85"/>
    <rect x="1" y="0" width="8" height="7" rx="2" fill="#ffffff" opacity="0.55"/>
  </g>
  <text x="724" y="236" fill="#c9cbe4" font-size="13" text-anchor="middle">Calendar</text>

  <!-- Nœud : Gmail -->
  <g filter="url(#nshadow)">
    <rect x="662" y="292" width="124" height="88" rx="14" fill="#41435c"/>
  </g>
  <g transform="translate(724,336)">
    <rect x="-21" y="-15" width="42" height="30" rx="5" fill="#ffffff"/>
    <path d="M-21 -13 L0 4 L21 -13" fill="none" stroke="#ea4335" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="724" y="408" fill="#c9cbe4" font-size="13" text-anchor="middle">Gmail</text>

  <!-- Sorties fantômes à droite -->
  <g opacity="0.55">
    <rect x="942" y="140" width="48" height="48" rx="12" fill="#41435c"/>
    <path d="M958 164 h16 M966 156 v16" stroke="#8c8fb4" stroke-width="3" stroke-linecap="round"/>
    <rect x="942" y="312" width="48" height="48" rx="12" fill="#41435c"/>
    <path d="M958 336 h16 M966 328 v16" stroke="#8c8fb4" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ═══ Rangée 2 : bilan hebdo ═══ -->
  <!-- Nœud : Cron -->
  <g filter="url(#nshadow)">
    <path d="M215 516 h-45 a44 44 0 0 0 0 88 h45 z" fill="#41435c"/>
    <rect x="172" y="516" width="86" height="88" rx="14" fill="#41435c"/>
  </g>
  <g transform="translate(215,560)">
    <circle r="21" fill="none" stroke="#ff9f43" stroke-width="4"/>
    <path d="M0 -10 V0 L8 6" stroke="#ff9f43" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="215" y="632" fill="#c9cbe4" font-size="13" text-anchor="middle">Ven. 17h</text>

  <!-- Nœud : Sheets -->
  <g filter="url(#nshadow)">
    <rect x="442" y="516" width="124" height="88" rx="14" fill="#41435c"/>
  </g>
  <g transform="translate(504,560)">
    <rect x="-17" y="-21" width="34" height="42" rx="5" fill="#34a853"/>
    <g stroke="#ffffff" stroke-width="2.5">
      <path d="M-9 -8 h18 M-9 0 h18 M-9 8 h18"/>
      <path d="M-1 -8 v16"/>
    </g>
  </g>
  <text x="504" y="632" fill="#c9cbe4" font-size="13" text-anchor="middle">Sheets</text>

  <!-- Nœud : Telegram -->
  <g filter="url(#nshadow)">
    <rect x="752" y="516" width="124" height="88" rx="14" fill="#41435c"/>
  </g>
  <g transform="translate(814,560)">
    <circle r="22" fill="#2aabee"/>
    <path d="M-11 -1 L11 -8 L6 9 L1 4 L-3 7 L-3 1 Z" fill="#ffffff"/>
  </g>
  <text x="814" y="632" fill="#c9cbe4" font-size="13" text-anchor="middle">Telegram</text>

  <!-- Mini-carte (coin bas droit, comme l'éditeur) -->
  <rect x="1020" y="620" width="140" height="90" rx="8" fill="#282a3d" stroke="#1d1e2d"/>
  <rect x="1035" y="648" width="14" height="10" rx="2" fill="#6c6f93"/>
  <rect x="1060" y="640" width="14" height="10" rx="2" fill="#6c6f93"/>
  <rect x="1060" y="658" width="14" height="10" rx="2" fill="#6c6f93"/>
  <rect x="1086" y="640" width="14" height="10" rx="2" fill="#6c6f93"/>
  <rect x="1086" y="658" width="14" height="10" rx="2" fill="#6c6f93"/>
  <rect x="1035" y="684" width="14" height="10" rx="2" fill="#6c6f93"/>
  <rect x="1060" y="684" width="14" height="10" rx="2" fill="#6c6f93"/>
  <rect x="1086" y="684" width="14" height="10" rx="2" fill="#6c6f93"/>
  <rect x="1114" y="632" width="38" height="70" rx="4" fill="none" stroke="#ff6d5a" stroke-width="1.5" opacity="0.8"/>

  <!-- Boutons zoom -->
  <rect x="40" y="620" width="44" height="90" rx="10" fill="#282a3d"/>
  <path d="M54 648 h16 M62 640 v16" stroke="#c9cbe4" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M54 684 h16" stroke="#c9cbe4" stroke-width="2.5" stroke-linecap="round"/>
</svg>
