<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="qbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b0f6e"/>
      <stop offset="100%" stop-color="#1d0838"/>
    </linearGradient>
    <filter id="qshadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#12041f" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#qbg)"/>

  <!-- Confettis discrets -->
  <g opacity="0.5">
    <rect x="120" y="110" width="14" height="14" rx="3" fill="#f43f5e" transform="rotate(25 127 117)"/>
    <rect x="1050" y="150" width="12" height="12" rx="3" fill="#facc15" transform="rotate(-20 1056 156)"/>
    <circle cx="220" cy="600" r="7" fill="#38bdf8"/>
    <path d="M1080 560 l12 20 h-24 z" fill="#4ade80" transform="rotate(15 1080 570)"/>
    <rect x="80" y="380" width="10" height="10" rx="2" fill="#38bdf8" transform="rotate(40 85 385)"/>
    <circle cx="1130" cy="380" r="6" fill="#f43f5e"/>
    <path d="M180 250 l10 17 h-20 z" fill="#facc15" transform="rotate(-30 180 258)"/>
    <circle cx="990" cy="660" r="6" fill="#facc15"/>
  </g>

  <!-- Bandeau haut : progression + timer -->
  <rect x="80" y="56" width="250" height="46" rx="23" fill="#ffffff" opacity="0.12"/>
  <rect x="80" y="56" width="175" height="46" rx="23" fill="#a855f7"/>
  <text x="205" y="87" fill="#ffffff" font-size="21" font-weight="800" text-anchor="middle">7/10</text>

  <g transform="translate(1074,79)">
    <circle r="40" fill="#12041f" opacity="0.6"/>
    <circle r="40" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="7"/>
    <path d="M0 -40 a40 40 0 1 1 -34.6 20" fill="none" stroke="#facc15" stroke-width="7" stroke-linecap="round"/>
    <text y="10" fill="#ffffff" font-size="28" font-weight="800" text-anchor="middle">12</text>
  </g>

  <!-- Carte question (texte remplacé par des barres skeleton) -->
  <g filter="url(#qshadow)">
    <rect x="220" y="140" width="760" height="180" rx="26" fill="#ffffff"/>
  </g>
  <circle cx="310" cy="230" r="42" fill="#a855f7"/>
  <text x="310" y="248" fill="#ffffff" font-size="50" font-weight="900" text-anchor="middle">?</text>
  <rect x="390" y="192" width="500" height="22" rx="11" fill="#d9d2e9"/>
  <rect x="390" y="232" width="380" height="22" rx="11" fill="#e7e2f2"/>

  <!-- Grille de réponses façon jeu TV : 4 tuiles couleur + symbole -->
  <g filter="url(#qshadow)">
    <rect x="150" y="380" width="430" height="130" rx="20" fill="#e21b3c"/>
  </g>
  <path d="M215 475 L250 415 L285 475 Z" fill="#ffffff"/>
  <rect x="320" y="432" width="220" height="26" rx="13" fill="#ffffff" opacity="0.55"/>

  <g filter="url(#qshadow)">
    <rect x="620" y="380" width="430" height="130" rx="20" fill="#1368ce"/>
  </g>
  <rect x="690" y="415" width="60" height="60" rx="8" fill="#ffffff" transform="rotate(45 720 445)"/>
  <rect x="790" y="432" width="220" height="26" rx="13" fill="#ffffff" opacity="0.55"/>

  <!-- Tuile jaune -->
  <g filter="url(#qshadow)">
    <rect x="150" y="540" width="430" height="130" rx="20" fill="#d89e00"/>
  </g>
  <circle cx="250" cy="605" r="34" fill="#ffffff"/>
  <rect x="320" y="592" width="180" height="26" rx="13" fill="#ffffff" opacity="0.55"/>

  <!-- Tuile verte : bonne réponse cochée -->
  <g filter="url(#qshadow)">
    <rect x="620" y="540" width="430" height="130" rx="20" fill="#26890c"/>
  </g>
  <rect x="620" y="540" width="430" height="130" rx="20" fill="none" stroke="#ffffff" stroke-width="5"/>
  <rect x="690" y="575" width="60" height="60" rx="10" fill="#ffffff"/>
  <rect x="790" y="592" width="200" height="26" rx="13" fill="#ffffff" opacity="0.55"/>
  <g transform="translate(1005,585)">
    <circle r="26" fill="#ffffff"/>
    <path d="M-11 0 L-3 9 L12 -9" fill="none" stroke="#26890c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
